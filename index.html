<!DOCTYPE html>
<html>
<head>
    <title>Mood Motivation App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #ff4f81;
            margin-bottom: 25px;
        }

        select {
            width: 80%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            background: #ff4f81;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff2e6d;
            transform: scale(1.05);
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
            color: #444;
            background: #fff4f8;
            padding: 15px;
            border-radius: 15px;
            min-height: 40px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        footer {
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌟 Mood Quote Generator 🌟</h1>

        <p class="subtitle">
            Select your mood and get instant motivation 💖
        </p>

        <select id="mood">
            <option value="happy">😊 Happy</option>
            <option value="sad">😢 Sad</option>
            <option value="tired">😴 Tired</option>
            <option value="motivated">🚀 Motivated</option>
            <option value="angry">😠 Angry</option>
        </select>

        <br>

        <button onclick="getQuote()">
            ✨ Get Quote
        </button>

        <div id="result">
            Your quote will appear here...
        </div>

        <footer>
            Made by Sharky 🦈
        </footer>

    </div>

    <script>
        async function getQuote() {

            let mood = document.getElementById("mood").value;

            document.getElementById("result").innerHTML =
                "⏳ Fetching your quote...";

            let response = await fetch(
                "https://mood-quote-api-1.onrender.com/mood/" + mood
            );

            let data = await response.json();

            document.getElementById("result").innerHTML =
                data.quote || data.message;
        }
    </script>

</body>
</html>
